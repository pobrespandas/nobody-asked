name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci
      - name: Run the complete verification gate
        run: npm run test:ci
      - name: Run Firestore emulator tests
        run: npm run test:firestore:emulator
      - name: Run Firestore recovery test
        run: npm run test:firestore:recovery
      - name: Run packaged end-to-end test
        run: npm run test:packaged
